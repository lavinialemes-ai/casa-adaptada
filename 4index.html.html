<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Painel IoT - Controle de LEDs (ESP8266)</title> 
    <!-- Tailwind CSS --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Firebase SDKs (Compat v8) --> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> 
</head> 
<body class="bg-white text-slate-800 min-h-screen flex flex-col justify-between font-sans"> 
  
    <!-- Cabeçalho --> 
    <header class="bg-slate-50 border-b border-slate-200 p-4 shadow-sm"> 
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2"> 
            <h1 class="text-xl font-bold flex items-center gap-2 text-slate-900"> 
                <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span> 
                Painel IoT - Casa Adaptada 
            </h1> 
            <span class="text-xs text-slate-600 bg-slate-200 px-3 py-1 rounded-full border border-slate-300 font-medium"> 
                Firebase Realtime Database 
            </span> 
        </div> 
    </header> 
  
    <!-- Conteúdo Principal --> 
    <main class="max-w-4xl mx-auto p-4 sm:p-6 w-full flex-grow flex flex-col justify-center"> 
         
        <div class="text-center mb-8"> 
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Controle dos 4 LEDs do ESP8266</h2> 
            <p class="text-slate-500 text-sm">Clique nos botões para alterar o estado em tempo real.</p> 
        </div> 
  
        <!-- Grade de 4 LEDs com cores diferentes --> 
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8"> 
             
            <!-- LED Principal (Amarelo Claro - /led) --> 
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow"> 
                <div class="flex items-center gap-4"> 
                    <div id="indicator-0" class="w-10 h-10 rounded-full bg-amber-100 border-2 border-amber-300 flex items-center justify-center transition-all duration-300"> 
                        <span class="w-4 h-4 rounded-full bg-amber-300 transition-all duration-300" id="bulb-0"></span> 
                    </div> 
                    <div> 
                        <h3 class="font-bold text-lg text-amber-950">LED Principal</h3> 
                        <p class="text-xs text-amber-700 font-mono">/led</p> 
                        <p class="text-xs text-amber-700 mt-1 font-medium" id="status-text-0">Desligado</p> 
                    </div> 
                </div> 
                <button onclick="toggleLed('led')" id="btn-0" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-amber-200 hover:bg-amber-300 text-amber-900 border border-amber-300"> 
                    Ligar 
                </button> 
            </div> 
  
            <!-- LED 1 (Azul Claro - /led1) --> 
            <div class="bg-sky-50 border border-sky-200 rounded-2xl p-5 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow"> 
                <div class="flex items-center gap-4"> 
                    <div id="indicator-1" class="w-10 h-10 rounded-full bg-sky-100 border-2 border-sky-300 flex items-center justify-center transition-all duration-300"> 
                        <span class="w-4 h-4 rounded-full bg-sky-300 transition-all duration-300" id="bulb-1"></span> 
                    </div> 
                    <div> 
                        <h3 class="font-bold text-lg text-sky-950">LED 1</h3> 
                        <p class="text-xs text-sky-700 font-mono">/led1</p> 
                        <p class="text-xs text-sky-700 mt-1 font-medium" id="status-text-1">Desligado</p> 
                    </div> 
                </div> 
                <button onclick="toggleLed('led1')" id="btn-1" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-sky-200 hover:bg-sky-300 text-sky-900 border border-sky-300"> 
                    Ligar 
                </button> 
            </div> 
  
            <!-- LED 2 (Rosa Claro - /led2) --> 
            <div class="bg-pink-50 border border-pink-200 rounded-2xl p-5 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow"> 
                <div class="flex items-center gap-4"> 
                    <div id="indicator-2" class="w-10 h-10 rounded-full bg-pink-100 border-2 border-pink-300 flex items-center justify-center transition-all duration-300"> 
                        <span class="w-4 h-4 rounded-full bg-pink-300 transition-all duration-300" id="bulb-2"></span> 
                    </div> 
                    <div> 
                        <h3 class="font-bold text-lg text-pink-950">LED 2</h3> 
                        <p class="text-xs text-pink-700 font-mono">/led2</p> 
                        <p class="text-xs text-pink-700 mt-1 font-medium" id="status-text-2">Desligado</p> 
                    </div> 
                </div> 
                <button onclick="toggleLed('led2')" id="btn-2" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-pink-200 hover:bg-pink-300 text-pink-900 border border-pink-300"> 
                    Ligar 
                </button> 
            </div> 
  
            <!-- LED 3 (Roxo Claro - /led3) --> 
            <div class="bg-purple-50 border border-purple-200 rounded-2xl p-5 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow"> 
                <div class="flex items-center gap-4"> 
                    <div id="indicator-3" class="w-10 h-10 rounded-full bg-purple-100 border-2 border-purple-300 flex items-center justify-center transition-all duration-300"> 
                        <span class="w-4 h-4 rounded-full bg-purple-300 transition-all duration-300" id="bulb-3"></span> 
                    </div> 
                    <div> 
                        <h3 class="font-bold text-lg text-purple-950">LED 3</h3> 
                        <p class="text-xs text-purple-700 font-mono">/led3</p> 
                        <p class="text-xs text-purple-700 mt-1 font-medium" id="status-text-3">Desligado</p> 
                    </div> 
                </div> 
                <button onclick="toggleLed('led3')" id="btn-3" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-purple-200 hover:bg-purple-300 text-purple-900 border border-purple-300"> 
                    Ligar 
                </button> 
            </div> 
  
        </div> 
  
        <!-- Ações Globais --> 
        <div class="flex flex-col sm:flex-row justify-center gap-3"> 
            <button onclick="setAll(1)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-md hover:shadow-lg text-sm"> 
                Ligar Todos 
            </button> 
            <button onclick="setAll(0)" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-md hover:shadow-lg text-sm"> 
                Desligar Todos 
            </button> 
        </div> 
  
    </main> 
  
    <!-- Rodapé --> 
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-100"> 
        Conectado em tempo real com ESP8266 e Firebase 
    </footer> 
  
    <!-- Lógica de Sincronização do Firebase --> 
    <script> 
        // Configuração exata apontando para o seu Realtime Database 
        const firebaseConfig = { 
            databaseURL: "https://casa-adaptada-default-rtdb.europe-west1.firebasedatabase.app" 
        }; 
  
        // Inicializar o Firebase 
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        } else { 
            firebase.app(); 
        } 
  
        const db = firebase.database(); 
  
        // Mapeamento dos caminhos correspondentes no banco de dados 
        const ledKeys = ['led', 'led1', 'led2', 'led3']; 
        const ledStates = { led: 0, led1: 0, led2: 0, led3: 0 }; 

        // Definição do tema visual de cada card quando ligado/desligado
        const cardThemes = [
            { // LED Principal (Amarelo)
                offBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-amber-200 hover:bg-amber-300 text-amber-900 border border-amber-300",
                onBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md bg-amber-500 hover:bg-amber-600 text-white",
                offIndicator: "w-10 h-10 rounded-full bg-amber-100 border-2 border-amber-300 flex items-center justify-center transition-all duration-300",
                onIndicator: "w-10 h-10 rounded-full bg-amber-200 border-2 border-amber-500 flex items-center justify-center transition-all duration-300 shadow-[0_0_12px_rgba(245,158,11,0.6)]",
                offBulb: "w-4 h-4 rounded-full bg-amber-300 transition-all duration-300",
                onBulb: "w-4 h-4 rounded-full bg-amber-500 shadow-[0_0_8px_#f59e0b] transition-all duration-300 animate-pulse",
                textOff: "text-xs text-amber-700 mt-1 font-medium",
                textOn: "text-xs text-amber-900 mt-1 font-bold"
            },
            { // LED 1 (Azul)
                offBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-sky-200 hover:bg-sky-300 text-sky-900 border border-sky-300",
                onBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md bg-sky-500 hover:bg-sky-600 text-white",
                offIndicator: "w-10 h-10 rounded-full bg-sky-100 border-2 border-sky-300 flex items-center justify-center transition-all duration-300",
                onIndicator: "w-10 h-10 rounded-full bg-sky-200 border-2 border-sky-500 flex items-center justify-center transition-all duration-300 shadow-[0_0_12px_rgba(14,165,233,0.6)]",
                offBulb: "w-4 h-4 rounded-full bg-sky-300 transition-all duration-300",
                onBulb: "w-4 h-4 rounded-full bg-sky-500 shadow-[0_0_8px_#0ea5e9] transition-all duration-300 animate-pulse",
                textOff: "text-xs text-sky-700 mt-1 font-medium",
                textOn: "text-xs text-sky-900 mt-1 font-bold"
            },
            { // LED 2 (Rosa)
                offBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-pink-200 hover:bg-pink-300 text-pink-900 border border-pink-300",
                onBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md bg-pink-500 hover:bg-pink-600 text-white",
                offIndicator: "w-10 h-10 rounded-full bg-pink-100 border-2 border-pink-300 flex items-center justify-center transition-all duration-300",
                onIndicator: "w-10 h-10 rounded-full bg-pink-200 border-2 border-pink-500 flex items-center justify-center transition-all duration-300 shadow-[0_0_12px_rgba(236,72,153,0.6)]",
                offBulb: "w-4 h-4 rounded-full bg-pink-300 transition-all duration-300",
                onBulb: "w-4 h-4 rounded-full bg-pink-500 shadow-[0_0_8px_#ec4899] transition-all duration-300 animate-pulse",
                textOff: "text-xs text-pink-700 mt-1 font-medium",
                textOn: "text-xs text-pink-900 mt-1 font-bold"
            },
            { // LED 3 (Roxo)
                offBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-sm bg-purple-200 hover:bg-purple-300 text-purple-900 border border-purple-300",
                onBtn: "px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md bg-purple-500 hover:bg-purple-600 text-white",
                offIndicator: "w-10 h-10 rounded-full bg-purple-100 border-2 border-purple-300 flex items-center justify-center transition-all duration-300",
                onIndicator: "w-10 h-10 rounded-full bg-purple-200 border-2 border-purple-500 flex items-center justify-center transition-all duration-300 shadow-[0_0_12px_rgba(168,85,247,0.6)]",
                offBulb: "w-4 h-4 rounded-full bg-purple-300 transition-all duration-300",
                onBulb: "w-4 h-4 rounded-full bg-purple-500 shadow-[0_0_8px_#a855f7] transition-all duration-300 animate-pulse",
                textOff: "text-xs text-purple-700 mt-1 font-medium",
                textOn: "text-xs text-purple-900 mt-1 font-bold"
            }
        ];
  
        // Monitorar alterações em tempo real para cada chave na raiz 
        ledKeys.forEach((key, index) => { 
            db.ref(key).on('value', (snapshot) => { 
                const val = snapshot.val() ? 1 : 0; 
                ledStates[key] = val; 
                updateUI(index, val); 
            }, (error) => { 
                console.error("Erro ao ler chave " + key + ":", error); 
            }); 
        }); 
  
        // Alternar estado individual ao clicar no botão 
        function toggleLed(key) { 
            const currentState = ledStates[key]; 
            const newState = currentState === 1 ? 0 : 1; 
             
            db.ref(key).set(newState).catch((error) => { 
                console.error("Erro ao atualizar o banco: " + error.message); 
            }); 
        } 
  
        // Ligar ou desligar todos simultaneamente 
        function setAll(state) { 
            const updates = {}; 
            updates['led'] = state; 
            updates['led1'] = state; 
            updates['led2'] = state; 
            updates['led3'] = state; 
  
            db.ref().update(updates).catch((error) => { 
                console.error("Erro ao atualizar o banco: " + error.message); 
            }); 
        } 
  
        // Atualizar a interface visual (cores dos botões e luzes indicadoras) 
        function updateUI(index, state) { 
            const indicator = document.getElementById(`indicator-${index}`); 
            const bulb = document.getElementById(`bulb-${index}`); 
            const statusText = document.getElementById(`status-text-${index}`); 
            const btn = document.getElementById(`btn-${index}`); 
            const theme = cardThemes[index];

            if (state === 1) { 
                indicator.className = theme.onIndicator; 
                bulb.className = theme.onBulb; 
                statusText.innerText = "Ligado"; 
                statusText.className = theme.textOn; 
                btn.className = theme.onBtn; 
                btn.innerText = "Desligar"; 
            } else { 
                indicator.className = theme.offIndicator; 
                bulb.className = theme.offBulb; 
                statusText.innerText = "Desligado"; 
                statusText.className = theme.textOff; 
                btn.className = theme.offBtn; 
                btn.innerText = "Ligar"; 
            } 
        } 
    </script> 
</body> 
</html>
